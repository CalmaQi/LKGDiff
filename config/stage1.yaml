output_dir: output_diff
# checkpoint: 
dataset:
  class: TransductiveDataset
  graphs: [cfmaily]
  root: XXXcfmaily

model:
  class: Ultra
  relation_model:
    class: RelNBFNet
    num_relation: 24
    num_nodes: 2378
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: dismult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
  entity_model:
    class: EntityNBFNet
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: dismult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
  vq_model:
    tokens: 4
    # 256对于vq最好 8token 8zdim  256对vae同样也好，大了似乎也不太好
    dim: 256
    encoder_hidden_dim: 512
    z_dim: 16
    # rel_dim: 64
    codebook_size: 10000
    label_smoothing: 0.0
    pos_weight_max: 5000000
    usage_lambda: 0.05
    beta: 0.25
    has_empty_class: no
    ema: no
    # reasoning_enabled: no
    # latent_replace_warmup_epochs: 400
    # latent_replace_weight: 1.0
diffusion:
  T: 200
  hidden: 256
  cond_dim: 512
  # checkpoint:
task:
  name: MultiGraphPretraining
  num_negative: 512
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10]

optimizer:
  class: AdamW
  lr: 5.0e-4
  # lr: 5.0e-5

scheduler:
  # class: none
  class: WarmupCosine
  warmup_steps: 2000
  min_lr_ratio: 0.1

augment:
  edge_drop: 0.99
  edge_drop_schedule:
    mode: linear  
    start: 0.0    
    end: 0.99      

train:
  gpus: {{ gpus }}
  batch_size: 1500  
  num_epoch: 8000 #
  log_interval: 10
  batch_per_epoch: 80000
  fast_test: 500
  epoch_pergraph: 100
  vq_chunk: 1024
  net_chunck: 1024
  eval_interval: 100
  # enable_vis: no
  # vis_interval: 2000
  ema: 
    enabled: no #
  stage_epochs: { identity: 0, ae: 0, vq: 6000 }

test:
  batch_size: 256
  #logger: wandb