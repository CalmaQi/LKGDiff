output_dir: output_diff
# checkpoint: 
dataset:
  class: TransductiveDataset
  graphs: [cfmaily]
  root: XXXcfmaily

model:
  class: Ultra
  relation_model:
    class: RelNBFNet
    num_relation: 24
    num_nodes: 2378
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: dismult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
  entity_model:
    class: EntityNBFNet
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: dismult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
  vq_model:
    tokens: 4
    dim: 256
    encoder_hidden_dim: 512
    z_dim: 16
    num_residual_quantizers: 2
    # rel_dim: 64
    codebook_size: 1024
    commitment_loss_weight: 1
    label_smoothing: 0.0
    pos_weight_max: 10000
    usage_lambda: 0.05
    beta: 0.25
    num_neg_samples: 0
    use_usage_loss: no
    use_sparsity_loss: no
    use_degree_loss: no
    has_empty_class: no
    ema: no
    # reasoning_enabled: no
    # latent_replace_warmup_epochs: 400
    # latent_replace_weight: 1.0
diffusion:
  T: 100
  hidden: 128
  cond_dim: 128
  time_dim: 128
  num_layers: 3
  beta_min: 1.0e-3
  beta_max: 2.0e-1
  # checkpoint:
task:
  name: MultiGraphPretraining
  num_negative: 512
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10]

evaluation:
  assumption: cwa

optimizer:
  class: AdamW
  lr: 5.0e-4
  # lr: 5.0e-5

scheduler:
  # class: none
  class: WarmupCosine
  warmup_steps: 2000
  min_lr_ratio: 0.1

augment:
  ratio_target_min: 0.95
  ratio_target_max: 1.0
  ratio_observed: 0.8
  edge_drop: 0.99
  edge_drop_schedule:
    mode: linear  
    start: 0.0    
    end: 0.99      

train:
  gpus: {{ gpus }}
  batch_size: 1500  
  num_epoch: 500 #
  log_interval: 10
  batch_per_epoch: 80000
  fast_test: 500
  epoch_pergraph: 20
  vq_chunk: 1024
  net_chunck: 1024
  eval_interval: 10
  # enable_vis: no
  # vis_interval: 2000
  ema: 
    enabled: no #
  stage_epochs: { identity: 0, ae: 0, vq: 500 }

test:
  batch_size: 256
  #logger: wandb