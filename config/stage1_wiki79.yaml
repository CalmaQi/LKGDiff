output_dir: output_diff
# checkpoint: XXX
dataset:
  class: TransductiveDataset
  graphs: [wiki79]
  root: XXX

model:
  class: Ultra
  relation_model:
    class: RelNBFNet
    num_relation: 170
    num_nodes: 7983
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: dismult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
  entity_model:
    class: EntityNBFNet
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: dismult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
  vq_model:
    tokens: 4
    dim: 64
    encoder_hidden_dim: 512
    z_dim: 16
    # rel_dim: 64
    codebook_size: 1024
    label_smoothing: 0.0
    pos_weight_max: 5000000
    usage_lambda: 0.05
    beta: 0.25
    num_neg_samples: 256
    use_usage_loss: no
    use_sparsity_loss: no
    use_degree_loss: no
    has_empty_class: no
    ema: no
    # reasoning_enabled: no
    # latent_replace_warmup_epochs: 400
    # latent_replace_weight: 1.0
diffusion:
  T: 50
  hidden: 128
  cond_dim: 128
  beta_min: 2.0e-3
  beta_max: 4.0e-1
  # checkpoint:
task:
  name: MultiGraphPretraining
  num_negative: 256
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10]

evaluation:
  threshold_split: valid  # Stage II: valid (or validation) / test
  threshold_steps: 10  # Number of threshold candidates
  assumption: rs_powa

optimizer:
  class: Adam
  lr: 5.0e-4
  # lr: 5.0e-5

scheduler:
  # class: none
  class: WarmupCosine
  warmup_steps: 2000
  min_lr_ratio: 0.1

augment:
  ratio_target_min: 0.7
  ratio_target_max: 1.0
  ratio_observed: 0.8
  edge_drop: 0.99
  edge_drop_schedule:
    mode: linear   
    start: 0.0     
    end: 0.99      

train:
  gpus: {{ gpus }}
  batch_size: 1000  
  num_epoch: 5000 #
  log_interval: 10
  batch_per_epoch: 80000
  fast_test: 500
  epoch_pergraph: 100
  vq_chunk: 128
  net_chunk: 128
  eval_interval: 100
  ema: 
    enabled: no #
  stage_epochs: { identity: 0, ae: 0, vq: 6000 }
